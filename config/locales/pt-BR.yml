  home:
    welcome: "Bem-vindo!"
    lead: "Use seu perfil do GitHub para liberar tudo o que o app oferece."
    terms_note: "Ao entrar, você aceita os Termos de Serviço e a Política de Privacidade."
  unfollowers:
    title: "Quem você segue e não segue você de volta"
    empty: "Todo mundo que você segue também segue você de volta."
