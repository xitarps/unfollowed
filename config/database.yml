default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "unfollowed_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: unfollowed_test

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { "unfollowed_production" } %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME") { "unfollowed_production" } %>_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME") { "unfollowed_production" } %>_cable
    migrations_paths: db/cable_migrate
