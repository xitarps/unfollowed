<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Original Ruby logo (adapted) inserted by user -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Unfollow Checker - complex ruby logo">
  <defs>
    <linearGradient id="gMain" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8a88"/>
      <stop offset="0.6" stop-color="#de2d22"/>
      <stop offset="1" stop-color="#8b0503"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <mask id="uMask">
      <rect width="100%" height="100%" fill="#fff"/>
      <!-- carve a 'U' from the mask to let the gem show through darker -->
      <g transform="translate(120,110) scale(1.1)">
        <path d="M-36 18 C-36 6,-8 -2,12 -2 C32 -2,56 6,56 18 L56 70 L48 70 L48 22 C48 16,36 10,12 10 C-12 10,-24 16,-24 22 L-24 70 L-36 70 Z" fill="#000"/>
      </g>
    </mask>
  </defs>

  <!-- base rounded canvas -->
  <rect width="320" height="320" rx="36" fill="#050505" />

  <!-- central complex ruby made of multiple facets -->
  <g transform="translate(80,48)" filter="url(#softShadow)">
    <!-- main silhouette -->
    <path d="M120 0 L20 48 L48 200 L120 236 L192 200 L220 48 Z" fill="url(#gMain)" stroke="#5f0b0a" stroke-width="3"/>

    <!-- top facet -->
    <path d="M120 10 L200 50 L120 180 L40 50 Z" fill="url(#gAccent)" opacity="0.92"/>

    <!-- left small facet -->
    <path d="M120 0 L80 50 L110 180 L120 0" fill="#ffffff08"/>

    <!-- right facet overlay -->
    <path d="M120 0 L160 50 L130 180 L120 0" fill="#00000012"/>

    <!-- fine edge highlights -->
    <path d="M120 12 L184 56" stroke="#ffffff22" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M120 12 L58 56" stroke="#ffffff10" stroke-width="1" stroke-linecap="round"/>

    <!-- subtle inner glow -->
    <ellipse cx="120" cy="190" rx="90" ry="24" fill="url(#gGlow)" opacity="0.7"/>
  </g>

  <!-- overlay ring and monogram that sits above the gem -->
  <g transform="translate(0,0)">
    <circle cx="160" cy="126" r="96" fill="none" stroke="#00000066" stroke-width="6" />

    <!-- monogram with slight bevel -->
    <g transform="translate(160,120)">
      <path d="M-44 16 C-44 2,-6 -6,16 -6 C38 -6,72 2,72 16 L72 72 L60 72 L60 22 C60 16,44 10,16 10 C-12 10,-32 16,-32 22 L-32 72 L-44 72 Z" fill="#fff"/>
      <path d="M-32 26 C-32 18,0 12,16 12 C32 12,56 18,56 26" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- masked darker cut so the monogram picks up depth from the gem below -->
    <rect x="0" y="0" width="320" height="320" mask="url(#uMask)" fill="#00000012"/>
  </g>
</svg>
